name: Manual database deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing DATABASE_CONNECTION_STRING
        required: true
        default: staging
        type: environment

permissions:
  contents: read

jobs:
  publish-database:
    name: Publish DACPAC before API deployment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build backend/src/Database/TravelPort.Database.sqlproj --configuration Release
      - name: Install SqlPackage
        run: dotnet tool install --global Microsoft.SqlPackage --version 170.4.83
      - name: Publish database
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
        run: >-
          sqlpackage /Action:Publish
          /SourceFile:backend/src/Database/bin/Release/TravelPort.Database.dacpac
          /TargetConnectionString:"$DATABASE_CONNECTION_STRING"
          /p:BlockOnPossibleDataLoss=True
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-travelport-dacpac
          path: backend/src/Database/bin/Release/TravelPort.Database.dacpac

  api-deployment-gate:
    name: API deployment gate
    needs: publish-database
    runs-on: ubuntu-latest
    steps:
      - run: echo "Database publish succeeded. Configure the company API deployment step here."
