name: CI/CD → Development

on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]

env:
  REGISTRY:  ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/travelport-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/travelport-web

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Build & verify ───────────────────────────────────────────────────
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/TravelPort.sln

      - name: Build backend (Release)
        run: dotnet build backend/TravelPort.sln -c Release --no-restore

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_BASE_URL: ""   # relative URL — Nginx proxies /api to backend

  # ── Job 2: Build & push Docker images ──────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    # Only push images on direct push to Development (not on PRs)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Build API image
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          push:       true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/travelport-api:latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/travelport-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to:   type=gha,mode=max,scope=api

      # Build Web image
      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       true
          build-args: VITE_API_BASE_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/travelport-web:latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.owner }}/travelport-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to:   type=gha,mode=max,scope=web

  # ── Job 3: Deploy to server ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    environment: production   # requires environment approval in GitHub settings

    steps:
      - name: Checkout (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: lower
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          source:   docker-compose.yml
          target:   /opt/travelport

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /opt/travelport

            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Write .env file from GitHub secrets
            cat > .env <<EOF
            IMAGE_TAG=${{ github.sha }}
            GITHUB_REPOSITORY_LOWER=${{ steps.lower.outputs.owner }}
            DB_SA_PASSWORD=${{ secrets.DB_SA_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER }}
            JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
            EMAIL_ENABLED=${{ secrets.EMAIL_ENABLED }}
            EMAIL_SMTP_HOST=${{ secrets.EMAIL_SMTP_HOST }}
            EMAIL_SMTP_PORT=${{ secrets.EMAIL_SMTP_PORT }}
            EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            RAZORPAY_ENABLED=${{ secrets.RAZORPAY_ENABLED }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            ALLOWED_ORIGIN_0=${{ secrets.ALLOWED_ORIGIN_0 }}
            ALLOWED_ORIGIN_1=${{ secrets.ALLOWED_ORIGIN_1 }}
            WEB_PORT=80
            EOF

            # Pull latest images and restart
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up dangling images
            docker image prune -f

            echo "Deployment complete — $(date)"
