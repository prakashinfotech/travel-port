name: CI/CD → Development

on:
  push:
    branches: [Development]
  pull_request:
    branches: [Development]

env:
  REGISTRY:  docker.io
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/travelport-api
  WEB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/travelport-web

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1a: Backend build & test ────────────────────────────────────────────
  build-backend:
    name: Backend — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore backend dependencies
        run: dotnet restore backend/TravelPort.sln

      - name: Run backend tests
        run: dotnet test backend/TravelPort.sln -c Release --no-restore --verbosity minimal

  # ── Job 1b: Frontend build & test (runs in parallel with backend) ────────────
  build-frontend:
    name: Frontend — Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm run test --prefix frontend -- --run

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_BASE_URL: ""   # relative URL — Nginx proxies /api to backend

  # ── Job 2a: Build & push API Docker image ───────────────────────────────────
  docker-api:
    name: Docker — Push API Image
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          push:       true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/travelport-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/travelport-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to:   type=gha,mode=max,scope=api

  # ── Job 2b: Build & push Web Docker image (parallel with API) ───────────────
  docker-web:
    name: Docker — Push Web Image
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       true
          build-args: VITE_API_BASE_URL=
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/travelport-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/travelport-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to:   type=gha,mode=max,scope=web

  # ── Job 3: Verify both images on Docker Hub ─────────────────────────────────
  verify:
    name: Verify Images on Docker Hub
    runs-on: ubuntu-latest
    needs: [docker-api, docker-web]
    if: github.event_name == 'push'

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify API image is accessible
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/travelport-api:${{ github.sha }}

      - name: Verify Web image is accessible
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/travelport-web:${{ github.sha }}

      - name: Print pull instructions
        run: |
          echo "Images published successfully. To run locally:"
          echo ""
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/travelport-api:latest"
          echo "  docker pull ${{ secrets.DOCKERHUB_USERNAME }}/travelport-web:latest"
          echo ""
          echo "Then: docker compose up -d"
