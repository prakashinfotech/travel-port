services:

  # ── SQL Server 2022 ──────────────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${DB_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - travelport
    restart: unless-stopped
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -P "$$DB_SA_PASSWORD" -C
        -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ── .NET 8 API ───────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}/travelport-api:${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;
        Database=TravelPortDb;
        User Id=sa;
        Password=${DB_SA_PASSWORD};
        TrustServerCertificate=True;
      JwtSettings__Secret:    "${JWT_SECRET}"
      JwtSettings__Issuer:    "${JWT_ISSUER}"
      JwtSettings__Audience:  "${JWT_AUDIENCE}"
      JwtSettings__AccessTokenExpiryMinutes: "15"
      Email__Enabled:   "${EMAIL_ENABLED:-false}"
      Email__SmtpHost:  "${EMAIL_SMTP_HOST}"
      Email__SmtpPort:  "${EMAIL_SMTP_PORT:-587}"
      Email__Username:  "${EMAIL_USERNAME}"
      Email__Password:  "${EMAIL_PASSWORD}"
      Email__FromEmail: "${EMAIL_FROM}"
      Email__FromName:  "TravelPort"
      Email__EnableSsl: "true"
      Razorpay__Enabled:   "${RAZORPAY_ENABLED:-false}"
      Razorpay__KeyId:     "${RAZORPAY_KEY_ID}"
      Razorpay__KeySecret: "${RAZORPAY_KEY_SECRET}"
      AllowedOrigins__0: "${ALLOWED_ORIGIN_0:-http://localhost}"
      AllowedOrigins__1: "${ALLOWED_ORIGIN_1:-https://localhost}"
      Duffel__Enabled: "false"
      Amadeus__Enabled: "false"
    networks:
      - travelport
    restart: unless-stopped

  # ── React Frontend (Nginx) ───────────────────────────────────────────────────
  web:
    image: ghcr.io/${GITHUB_REPOSITORY_LOWER}/travelport-web:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - travelport
    restart: unless-stopped

volumes:
  sqldata:

networks:
  travelport:
    driver: bridge
