services:

  # ──────────────────────────────────────────────────────────────────────────
  # SQL Server 2022
  # ──────────────────────────────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      SA_PASSWORD: "${DB_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"

    volumes:
      - sqldata:/var/opt/mssql

    networks:
      - travelport

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s


  # ──────────────────────────────────────────────────────────────────────────
  # .NET 8 API
  # ──────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: travelport-api:local

    depends_on:
      db:
        condition: service_healthy

    environment:

      # ASP.NET
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5003

      # Database
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=TravelPortDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;"

      # Database initialization
      Database__ApplyEfMigrations: "true"
      Database__RunSeedData: "true"

      # JWT
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
      JwtSettings__AccessTokenExpiryMinutes: "15"

      # Email
      Email__Enabled: "${EMAIL_ENABLED:-false}"
      Email__SmtpHost: "${EMAIL_SMTP_HOST}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT:-587}"
      Email__Username: "${EMAIL_USERNAME}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__FromEmail: "${EMAIL_FROM}"
      Email__FromName: "TravelPort"
      Email__EnableSsl: "true"

      # Razorpay
      Razorpay__Enabled: "${RAZORPAY_ENABLED:-false}"
      Razorpay__KeyId: "${RAZORPAY_KEY_ID}"
      Razorpay__KeySecret: "${RAZORPAY_KEY_SECRET}"

      # CORS
      AllowedOrigins__0: "${ALLOWED_ORIGIN_0}"
      AllowedOrigins__1: "${ALLOWED_ORIGIN_1:-}"

      # Travel APIs
      Duffel__Enabled: "false"
      Amadeus__Enabled: "false"

      # Groq
      Groq__ApiKey: "${GROQ_API_KEY:-}"
      Groq__Model: "${GROQ_MODEL:-llama-3.3-70b-versatile}"

      # Frontend URL
      AppSettings__FrontendUrl: "${FRONTEND_URL}"

    # Expose API only to localhost.
    # Host Nginx can access it.
    # It is NOT directly accessible from the Internet.
    ports:
      - "127.0.0.1:5003:5003"

    networks:
      - travelport

    restart: unless-stopped


  # ──────────────────────────────────────────────────────────────────────────
  # React Frontend + Nginx
  # ──────────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        # Example:
        # VITE_API_BASE_URL=https://travelport-api.example.com
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"

    image: travelport-web:local

    # Host Nginx uses 80/443.
    # Frontend container therefore uses localhost:8082.
    ports:
      - "127.0.0.1:8082:80"

    depends_on:
      - api

    networks:
      - travelport

    restart: unless-stopped


# ────────────────────────────────────────────────────────────────────────────
# Persistent volumes
# ────────────────────────────────────────────────────────────────────────────
volumes:
  sqldata:


# ────────────────────────────────────────────────────────────────────────────
# Docker network
# ────────────────────────────────────────────────────────────────────────────
networks:
  travelport:
    driver: bridge
